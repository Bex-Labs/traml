<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BexAML | Secure Password Reset</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@300,0&display=swap" rel="stylesheet" />
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card border-0 shadow-lg" style="width: 400px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <span class="material-symbols-outlined text-primary fs-1 mb-2">lock_reset</span>
                <h4 class="fw-bold text-dark">Update Password</h4>
                <p class="text-muted small">Enter your new secure password below.</p>
            </div>

            <form id="update-password-form">
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">New Password</label>
                    <input type="password" class="form-control bg-light" id="new-password" required minlength="8" placeholder="••••••••">
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold text-muted">Confirm Password</label>
                    <input type="password" class="form-control bg-light" id="confirm-password" required minlength="8" placeholder="••••••••">
                </div>
                
                <button type="submit" class="btn btn-primary w-100 fw-bold" id="btn-update">
                    Secure & Update Password
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/config.js';

        // Listen for the auth state change that happens when they click the email link
        supabase.auth.onAuthStateChange(async (event, session) => {
            if (event == "PASSWORD_RECOVERY") {
                console.log("Password recovery session established");
            }
        });

        document.getElementById('update-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-update');
            const pass1 = document.getElementById('new-password').value;
            const pass2 = document.getElementById('confirm-password').value;

            if (pass1 !== pass2) return alert("Passwords do not match.");

            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Updating...';
            btn.disabled = true;

            try {
                // Update the user's password securely
                const { error } = await supabase.auth.updateUser({
                    password: pass1
                });

                if (error) throw error;

                alert("Password updated successfully! Redirecting to login...");
                
                // Immediately log them out so they must log in with the new credentials
                await supabase.auth.signOut();
                window.location.replace('index.html');

            } catch (err) {
                console.error("Update Error:", err);
                alert("Failed to update password: " + err.message);
                btn.innerHTML = 'Secure & Update Password';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
