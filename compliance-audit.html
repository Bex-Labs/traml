<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentinel AML | Branch Audit Ledger</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@300,0&display=swap" rel="stylesheet" />
    <link href="./css/theme.css" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <script type="module" src="./js/session.js"></script>
</head>
<body class="bg-light font-inter" style="display: none;" id="audit-body">

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm px-4">
        <div class="container-fluid p-0">
            <a class="navbar-brand d-flex align-items-center gap-2" href="dashboard.html">
                <span class="material-symbols-outlined text-primary fs-4">shield</span>
                <span class="fs-6 fw-bold tracking-wide text-dark uppercase">Sentinel<span class="text-primary">AML</span></span>
            </a>
            
            <div class="d-flex align-items-center gap-2 border-start ps-3">
                <div class="text-end">
                    <div class="fw-semibold text-dark" style="font-size: 0.85rem;" id="ui-user-name">Loading...</div>
                    <div class="text-muted fw-bold uppercase" style="font-size: 0.65rem;">Head of Compliance</div>
                </div>
                <span class="material-symbols-outlined text-muted fs-2">account_circle</span>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold text-dark mb-1">Branch Audit Ledger</h3>
                <p class="text-muted small">Immutable event tracking for your specific tenant.</p>
            </div>
            <a href="dashboard.html" class="btn btn-outline-secondary btn-sm fw-medium d-flex align-items-center">
                <span class="material-symbols-outlined fs-6 me-1">arrow_back</span> Return to Dashboard
            </a>
        </div>

        <div class="card shadow-sm border-0 rounded-3 mb-4">
            <div class="card-body bg-white d-flex flex-wrap gap-3 align-items-end">
                <div class="flex-grow-1" style="max-width: 200px;">
                    <label class="form-label small fw-semibold text-muted mb-1">Start Date</label>
                    <input type="date" class="form-control form-control-sm" id="filter-start">
                </div>
                <div class="flex-grow-1" style="max-width: 200px;">
                    <label class="form-label small fw-semibold text-muted mb-1">End Date</label>
                    <input type="date" class="form-control form-control-sm" id="filter-end">
                </div>
                <div class="flex-grow-1" style="max-width: 250px;">
                    <label class="form-label small fw-semibold text-muted mb-1">Event Type</label>
                    <select class="form-select form-select-sm" id="filter-type">
                        <option value="all">All Events</option>
                        <option value="auth">Authentication (Logins)</option>
                        <option value="transaction_flag">Transaction Flags</option>
                        <option value="kyc_update">KYC Updates</option>
                    </select>
                </div>
                
                <div class="ms-auto d-flex gap-2">
                    <button class="btn btn-outline-success btn-sm fw-medium d-flex align-items-center" id="export-csv-btn">
                        <span class="material-symbols-outlined fs-6 me-1">table</span> Export CSV
                    </button>
                    <button class="btn btn-danger btn-sm fw-medium d-flex align-items-center" id="export-pdf-btn">
                        <span class="material-symbols-outlined fs-6 me-1">picture_as_pdf</span> Export PDF
                    </button>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0 rounded-3">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="audit-table" style="table-layout: fixed; width: 100%;">
                    <thead class="table-light text-muted small fw-semibold uppercase tracking-wider">
                        <tr>
                            <th class="ps-4 py-3" style="width: 18%;">Timestamp</th>
                            <th class="py-3" style="width: 22%;">Event Type</th>
                            <th class="py-3" style="width: 18%;">Actor (User ID)</th>
                            <th class="py-3" style="width: 18%;">Target / Resource</th>
                            <th class="pe-4 py-3" style="width: 24%;">Details</th>
                        </tr>
                    </thead>
                    <tbody id="audit-table-body">
                        <tr>
                            <td colspan="5" class="text-center py-4 text-muted">
                                <span class="spinner-border spinner-border-sm me-2" role="status"></span> Loading audit logs...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <div class="toast-container position-fixed top-0 end-0 p-4" style="z-index: 1055;">
        <div id="dynamicToast" class="toast align-items-center border-0 shadow text-white" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fw-medium font-inter" id="dynamicToastBody"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="module" src="./js/audit-logs.js"></script>
    
    <script type="module">
        import { supabase } from './js/config.js';
        async function fetchName() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('ui-user-name').innerText = session.user.email;
            }
        }
        fetchName();
    </script>
</body>
</html>
