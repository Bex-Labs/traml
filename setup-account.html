<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BexAML | Claim Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@300,0&display=swap" rel="stylesheet" />
    <link href="./css/theme.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100 font-inter">

    <div class="container" style="max-width: 450px;">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center gap-2 mb-2">
                <span class="material-symbols-outlined text-primary fs-2">security</span>
                <span class="fs-4 fw-bold tracking-wide text-dark uppercase">BEX<span class="text-primary">AML</span></span>
            </div>
            <p class="text-muted small">Account Provisioning & Security Setup</p>
        </div>

        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4 p-md-5">
                <h5 class="card-title fw-bold text-dark mb-2">Set Your Password</h5>
                <p class="text-muted small mb-4">Your identity has been verified. Please create a strong password to secure your compliance workspace.</p>
                
                <form id="setup-form">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted">New Password</label>
                        <input type="password" class="form-control bg-light" id="new-password" required minlength="8" placeholder="Minimum 8 characters">
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-muted">Confirm Password</label>
                        <input type="password" class="form-control bg-light" id="confirm-password" required minlength="8">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="submit-btn">
                        Secure Account & Enter <span class="material-symbols-outlined align-middle fs-6 ms-1">arrow_forward</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/config.js';

        document.getElementById('setup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const pass = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;

            if (pass !== confirm) {
                alert("Passwords do not match.");
                return;
            }

            btn.innerHTML = 'Securing...';
            btn.disabled = true;

            // Supabase already established the session when they clicked the invite link.
            // We just need to update the user profile with the new password.
            const { data, error } = await supabase.auth.updateUser({
                password: pass
            });

            if (error) {
                alert(`Security Error: ${error.message}`);
                btn.innerHTML = 'Secure Account & Enter';
                btn.disabled = false;
            } else {
                // Password set successfully! Route them to the correct dashboard.
                const { data: { session } } = await supabase.auth.getSession();
                const jwtPayload = JSON.parse(atob(session.access_token.split('.')[1]));
                const userRole = jwtPayload.app_metadata?.role;

                if (userRole === 'it_admin') window.location.replace('admin-dashboard.html');
                else if (userRole === 'compliance_officer') window.location.replace('compliance-officer.html');
                else window.location.replace('dashboard.html');
            }
        });
    </script>
</body>
</html>
