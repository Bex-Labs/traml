<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentinel AML | Audit Logs & Export</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@300,0&display=swap" rel="stylesheet" />
    <link href="./css/theme.css" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <script type="module" src="./js/session.js"></script>
</head>
<body class="bg-light font-inter" style="display: none;" id="audit-body">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary px-4">
        <div class="container-fluid p-0">
            <a class="navbar-brand d-flex align-items-center gap-2" href="admin-dashboard.html">
                <span class="material-symbols-outlined text-danger fs-4">terminal</span>
                <span class="fs-6 fw-bold tracking-wide text-white uppercase">Sentinel<span class="text-danger">Admin</span></span>
            </a>
            
            <div class="d-flex align-items-center gap-2 border-start border-secondary ps-3">
                <div class="text-end text-white">
                    <div class="fw-semibold" style="font-size: 0.85rem;" id="ui-admin-name">System Administrator</div>
                </div>
                <span class="material-symbols-outlined text-muted fs-2">shield_person</span>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row" style="height: calc(100vh - 57px);">
            
            <div class="col-md-2 bg-dark p-0 d-flex flex-column justify-content-between border-end border-secondary">
                <div class="list-group list-group-flush mt-3 bg-dark">
                    <a href="admin-dashboard.html" class="list-group-item list-group-item-action border-0 py-3 d-flex align-items-center gap-3 text-white-50 bg-dark">
                        <span class="material-symbols-outlined">dns</span>
                        <span class="small fw-semibold">Platform Health</span>
                    </a>
                    
                    <a href="user-management.html" class="list-group-item list-group-item-action border-0 py-3 d-flex align-items-center gap-3 text-white-50 bg-dark">
                        <span class="material-symbols-outlined">manage_accounts</span>
                        <span class="small fw-semibold">User Management</span>
                    </a>
                    
                    <a href="audit-logs.html" class="list-group-item list-group-item-action border-0 py-3 d-flex align-items-center gap-3 text-white bg-dark border-start border-danger border-3">
                        <span class="material-symbols-outlined">history</span>
                        <span class="small fw-semibold">Global Audit Logs</span>
                    </a>
                </div>
                
                <div class="p-3 border-top border-secondary">
                    <button id="logout-btn" class="btn btn-outline-danger btn-sm w-100 d-flex align-items-center justify-content-center gap-2">
                        <span class="material-symbols-outlined fs-6">logout</span> Global Disconnect
                    </button>
                </div>
            </div>

            <div class="col-md-10 p-4 overflow-auto">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h4 class="fw-bold text-dark mb-1">System Audit Logs</h4>
                        <p class="text-muted small">Immutable event tracking for regulatory compliance.</p>
                    </div>
                </div>

                <div class="card shadow-sm border-0 rounded-3 mb-4">
                    <div class="card-body bg-white d-flex flex-wrap gap-3 align-items-end">
                        <div class="flex-grow-1" style="max-width: 200px;">
                            <label class="form-label small fw-semibold text-muted mb-1">Start Date</label>
                            <input type="date" class="form-control form-control-sm" id="filter-start">
                        </div>
                        <div class="flex-grow-1" style="max-width: 200px;">
                            <label class="form-label small fw-semibold text-muted mb-1">End Date</label>
                            <input type="date" class="form-control form-control-sm" id="filter-end">
                        </div>
                        <div class="flex-grow-1" style="max-width: 250px;">
                            <label class="form-label small fw-semibold text-muted mb-1">Event Type</label>
                            <select class="form-select form-select-sm" id="filter-type">
                                <option value="all">All Events</option>
                                <option value="auth">Authentication (Logins)</option>
                                <option value="admin_action">Admin Actions (Bans/Resets)</option>
                                <option value="transaction_flag">Transaction Flags</option>
                            </select>
                        </div>
                        
                        <div class="ms-auto d-flex gap-2">
                            <button class="btn btn-outline-success btn-sm fw-medium d-flex align-items-center" id="export-csv-btn">
                                <span class="material-symbols-outlined fs-6 me-1">table</span> Export CSV
                            </button>
                            <button class="btn btn-danger btn-sm fw-medium d-flex align-items-center" id="export-pdf-btn">
                                <span class="material-symbols-outlined fs-6 me-1">picture_as_pdf</span> Export PDF
                            </button>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm border-0 rounded-3">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" id="audit-table">
                            <thead class="table-light text-muted small fw-semibold uppercase tracking-wider">
                        <div class="card shadow-sm border-0 rounded-3">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" id="audit-table" style="table-layout: fixed; width: 100%;">
                            <thead class="table-light text-muted small fw-semibold uppercase tracking-wider">
                                <tr>
                                    <th class="ps-4 py-3" style="width: 18%;">Timestamp</th>
                                    <th class="py-3" style="width: 22%;">Event Type</th>
                                    <th class="py-3" style="width: 18%;">Actor (User ID)</th>
                                    <th class="py-3" style="width: 18%;">Target / Resource</th>
                                    <th class="pe-4 py-3" style="width: 24%;">Details</th>
                                </tr>
                            </thead>
                            <tbody id="audit-table-body">
                                <tr>
                                    <td colspan="5" class="text-center py-4 text-muted">
                                        <span class="spinner-border spinner-border-sm me-2" role="status"></span> Loading audit logs...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/audit-logs.js"></script>
    <script type="module">
        import { supabase } from './js/config.js';
        document.getElementById('logout-btn')?.addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.replace('login.html');
        });
    </script>
</body>
</html>
